site_name: Studiebasen
site_description: Mine notater, forelesninger og eksamensforberedelser samlet på ett sted
use_directory_urls: false   # gjør at siden også fungerer når du åpner HTML-filene direkte

theme:
  name: material
  language: nb
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: {icon: material/weather-night, name: Bytt til mørk modus}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: {icon: material/weather-sunny, name: Bytt til lys modus}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: ["no", "en"]   # søk på både norsk og engelsk (pensum er blandet)

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/vendor/react.production.min.js
  - javascripts/vendor/react-dom.production.min.js
  - javascripts/algwidgets.js
  - javascripts/algwidgets-mount.js
  - javascripts/eksamener.js
  - javascripts/opplesning.js

# PDF-ene ligger lokalt og er holdt utenfor Git, så manglende PDF-er skal ikke gi advarsler
validation:
  links:
    not_found: info

nav:
  - Forside: index.md
  - Eksamener: eksamener.md
  - Sikkerhet og robusthet:
      - ttm4185/index.md
      - Forelesninger:
          - "Del I: Komplekse IKT-systemer": ttm4185/del-1-komplekse-systemer.md
          - "Del II: Taksonomi": ttm4185/del-2-taksonomi.md
          - "Del III: Trusler og sårbarheter": ttm4185/del-3-trusler.md
          - "Del IV: Trusler og trender": ttm4185/del-4-trusler-og-trender.md
          - "Del V: Risikostyring": ttm4185/del-5-risikostyring.md
      - Gjesteforelesninger: ttm4185/gjesteforelesninger.md
      - Eksamen: ttm4185/eksamen.md
      - Formler og tall: ttm4185/formler.md
      - Begreper: ttm4185/begreper.md
  - Algoritmer og datastrukturer:
      - algdat/index.md
      - Pensum og forelesninger: algdat/pensum.md
      - Algoritmene:
          - "1. Sortering ved sammenligning": algdat/1-sortering-sammenligning.md
          - "2. Sortering i lineær tid": algdat/2-sortering-lineaer-tid.md
          - "3. Søk og utvalg": algdat/3-sok-og-utvalg.md
          - "4. Datastrukturer": algdat/4-datastrukturer.md
          - "5. Dynamisk programmering": algdat/5-dynamisk-programmering.md
          - "6. Grådige algoritmer": algdat/6-gradige-algoritmer.md
          - "7. Graftraversering": algdat/7-graftraversering.md
          - "8. Minimale spenntrær": algdat/8-minimale-spenntraer.md
          - "9. Korteste vei fra én til alle": algdat/9-korteste-vei-en-til-alle.md
          - "10. Korteste vei fra alle til alle": algdat/10-korteste-vei-alle-til-alle.md
          - "11. Maksimal flyt": algdat/11-maksimal-flyt.md
          - "12. NP-kompletthet": algdat/12-np-kompletthet.md
  - Ex.phil.:
      - exphil/index.md
      - "Tenk!":
          - "Del 1: Argumentasjon": exphil/tenk-1-argumentasjon.md
          - "Del 2: Vitenskapelig tenkemåte": exphil/tenk-2-vitenskapelig-tenkemate.md
          - "Kap. 8: Er vitenskapen verdifri?": exphil/tenk-3-verdifri.md
          - "Kap. 12: Menneskesyn": exphil/tenk-4-menneskesyn.md
          - "Kap. 13: Teknologi, menneske, samfunn": exphil/tenk-5-teknologi.md
          - "Del 4: Normativ etikk": exphil/tenk-6-etikk.md
          - "Del 5: Politisk filosofi": exphil/tenk-7-politisk-filosofi.md
      - "Vitenskap, teknologi og samfunn":
          - "Briggle & Mitcham kap. 3": exphil/briggle-mitcham-kap-3.md
          - "Briggle & Mitcham kap. 9": exphil/briggle-mitcham-kap-9.md
          - "van de Poel & Royakkers": exphil/van-de-poel-royakkers.md
      - Bærekraft:
          - "Carson & Skauge": exphil/carson-skauge.md
          - Hovi: exphil/hovi.md
          - "Lavik & Pedersen": exphil/lavik-pedersen.md
      - Begreper: exphil/begreper.md
  - Legg til fag: legg-til-fag.md
